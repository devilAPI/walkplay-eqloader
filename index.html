<!DOCTYPE html>
<html>
<head>
  <!--
    Replaced by the `--base-href` argument of `flutter build web`; must start
    and end with "/".
  -->
  <base href="/walkplay-eqloader/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Edit parametric EQ and push it to Walkplay-based USB DAC dongles from the browser.">
  <meta name="theme-color" content="#14161A">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PEQ Loader">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Walkplay PEQ Loader</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Same palette as lib/ui/theme.dart, so there's no white flash. */
    :root {
      --chassis: #14161A;
      --panel: #1C1F26;
      --input: #262A33;
      --line: #2E333D;
      --ink: #E6E9EF;
      --muted: #8A93A3;
      --accent: #4ED0C4;
      --danger: #E5687A;
    }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--chassis);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      box-sizing: border-box;
      background: var(--chassis);
      z-index: 10;
    }
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      color: var(--muted);
      font-size: 14px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--line);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .spinner { animation-duration: 3s; }
    }
    #notice {
      max-width: 460px;
      width: 100%;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 24px;
      box-sizing: border-box;
    }
    #notice .tag {
      color: var(--danger);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin: 0 0 8px;
    }
    #notice h1 {
      font-size: 20px;
      margin: 0 0 12px;
    }
    #notice p {
      color: var(--muted);
      line-height: 1.5;
      margin: 0 0 20px;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .btn {
      display: block;
      text-align: center;
      padding: 12px 16px;
      border-radius: 4px;
      border: 1px solid var(--line);
      background: var(--input);
      color: var(--ink);
      font: inherit;
      font-size: 15px;
      text-decoration: none;
      cursor: pointer;
    }
    .btn.accent {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--chassis);
      font-weight: 700;
    }
    .btn.subtle {
      background: none;
      border-color: transparent;
      color: var(--muted);
    }
    .btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div id="splash">
    <div id="loading" hidden>
      <div class="spinner" aria-hidden="true"></div>
      <span>Loading PEQ Loader…</span>
    </div>

    <div id="notice" role="alert" hidden>
      <p class="tag">Device access not available</p>
      <h1 id="notice-title"></h1>
      <p id="notice-text"></p>
      <div class="actions">
        <a id="notice-primary" class="btn accent" hidden></a>
        <a id="notice-releases" class="btn">All downloads</a>
        <button id="notice-continue" class="btn subtle" type="button">
          Continue anyway (editing and AutoEQ only)
        </button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var REPO = 'devilAPI/walkplay-eqloader';
      var RELEASES = 'https://github.com/' + REPO + '/releases';

      var ua = navigator.userAgent;
      // iPadOS reports itself as a Mac; touch support gives it away.
      var isIOS = /iPad|iPhone|iPod/.test(ua) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var isAndroid = /Android/i.test(ua);
      var hasWebHid = 'hid' in navigator;

      // Installable web app: sw.js serves the last visit when offline.
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(function (e) {
          console.warn('Service worker registration failed:', e);
        });
      }
      // Keep the browser's install prompt for Settings → Install as an app
      // (lib/platform/pwa_web.dart). Without preventDefault, some browsers
      // show their own install banner right away.
      window.eqloaderInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.eqloaderInstallPrompt = e;
      });
      window.addEventListener('appinstalled', function () {
        window.eqloaderInstallPrompt = null;
      });

      var splash = document.getElementById('splash');
      var loading = document.getElementById('loading');
      var notice = document.getElementById('notice');
      var primary = document.getElementById('notice-primary');

      document.getElementById('notice-releases').href = RELEASES;

      // Flutter paints over the splash once its first frame is ready.
      window.addEventListener('flutter-first-frame', function () {
        splash.remove();
      });

      var started = false;
      function startApp() {
        if (started) return;
        started = true;
        notice.hidden = true;
        loading.hidden = false;
        var script = document.createElement('script');
        script.src = 'flutter_bootstrap.js';
        script.async = true;
        document.body.appendChild(script);
      }

      function showNotice(title, text) {
        document.getElementById('notice-title').textContent = title;
        document.getElementById('notice-text').textContent = text;
        notice.hidden = false;
      }

      // Link the newest release's APK directly. /releases/latest skips
      // pre-releases (the dev-N builds), so ask the API instead.
      function linkLatestApk() {
        primary.textContent = 'Download the Android app';
        primary.href = RELEASES;
        primary.hidden = false;
        fetch('https://api.github.com/repos/' + REPO + '/releases?per_page=10')
          .then(function (r) { return r.ok ? r.json() : []; })
          .then(function (releases) {
            for (var i = 0; i < releases.length; i++) {
              var assets = releases[i].assets || [];
              for (var j = 0; j < assets.length; j++) {
                if (/\.apk$/i.test(assets[j].name)) {
                  primary.href = assets[j].browser_download_url;
                  primary.textContent =
                    'Download the Android app (' + releases[i].tag_name + ')';
                  return;
                }
              }
            }
          })
          .catch(function () { /* keep the releases page link */ });
      }

      document.getElementById('notice-continue')
        .addEventListener('click', startApp);

      if (isAndroid) {
        showNotice(
          'Use the Android app',
          'Mobile browsers can’t talk to USB devices. Install the Android ' +
          'app instead: it connects to the dongle over USB-C / OTG and has ' +
          'every feature of this site.');
        linkLatestApk();
      } else if (isIOS) {
        showNotice(
          'iPhone and iPad aren’t supported',
          'iOS doesn’t let browsers or apps talk to USB HID devices, so ' +
          'the dongle can’t be configured from here. Use a computer ' +
          '(Chrome, Edge or Opera, or the desktop app) or an Android phone.');
      } else if (!hasWebHid) {
        showNotice(
          'This browser can’t connect to the dongle',
          'Talking to the dongle needs WebHID, which only Chromium-based ' +
          'browsers support: Chrome, Edge, Opera or Chromium. Open ' +
          'this page in one of them, or download the desktop app for ' +
          'Linux, Windows or macOS.');
      } else {
        startApp();
      }
    })();
  </script>
</body>
</html>
