name: Dev release

# Every push to flutter-rewrite builds Android, Linux, Windows and macOS
# binaries and publishes them as a pre-release named dev-<commit count>.
on:
  push:
    branches: [flutter-rewrite]

permissions:
  contents: write

concurrency:
  group: dev-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      count: ${{ steps.count.outputs.count }}
      tag: dev-${{ steps.count.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for the commit count
      - id: count
        run: echo "count=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      name: ${{ needs.version.outputs.tag }}
      build-number: ${{ needs.version.outputs.count }}

  # Publishes whatever built, as long as the Android build (which also runs
  # the tests) succeeded; a failing desktop target doesn't block the release.
  release:
    needs: [version, build]
    # needs.build fails as a whole if any target fails, so check for the APK
    # below instead.
    if: ${{ !cancelled() && needs.version.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          if ! ls dist/*.apk >/dev/null 2>&1; then
            echo "Android build (and tests) failed; not publishing." >&2
            exit 1
          fi
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes "Development build of ${GITHUB_SHA::7} (${GITHUB_REF_NAME})."
