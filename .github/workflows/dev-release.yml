name: Dev release

# Every push to flutter-rewrite builds the APK and publishes it as a
# pre-release named dev-<commit count>.
on:
  push:
    branches: [flutter-rewrite]

permissions:
  contents: write

concurrency:
  group: dev-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for the commit count

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Version
        id: version
        run: echo "count=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - run: flutter pub get

      - run: flutter test

      - name: Build APK
        run: >
          flutter build apk --release
          --build-number=${{ steps.version.outputs.count }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: dev-${{ steps.version.outputs.count }}
        run: |
          apk="eqloader-$TAG.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$apk"
          gh release create "$TAG" "$apk" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes "Development build of ${GITHUB_SHA::7} (${GITHUB_REF_NAME})."
