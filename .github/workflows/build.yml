name: Build

# Reusable: builds Android, Linux, Windows and macOS and uploads each as an
# artifact named eqloader-<name>-<platform>. Called by dev-release.yml and
# release.yml, which publish the artifacts.
on:
  workflow_call:
    inputs:
      name:
        description: Version label used in file names (e.g. dev-57, v1.3)
        required: true
        type: string
      build-name:
        description: Flutter --build-name (x.y.z); empty keeps pubspec.yaml's
        required: false
        type: string
        default: ''
      build-number:
        description: Flutter --build-number (Android versionCode etc.)
        required: true
        type: string
      installer:
        description: Also build Windows setup.exe installers (Inno Setup)
        required: false
        type: boolean
        default: false

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - run: >
          flutter build apk --release
          --build-number=${{ inputs.build-number }}
          --dart-define=APP_VERSION=${{ inputs.name }}
          ${{ inputs.build-name && format('--build-name={0}', inputs.build-name) || '' }}
      - run: cp build/app/outputs/flutter-apk/app-release.apk eqloader-${{ inputs.name }}-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: eqloader-*.apk

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: x64, runner: ubuntu-latest }
          - { os: linux, arch: arm64, runner: ubuntu-24.04-arm }
          - { os: windows, arch: x64, runner: windows-latest }
          - { os: windows, arch: arm64, runner: windows-11-arm }
          # One universal (x64 + arm64) app; Flutter builds macOS universal.
          - { os: macos, arch: universal, runner: macos-latest }
    runs-on: ${{ matrix.runner }}
    env:
      NAME: eqloader-${{ inputs.name }}-${{ matrix.os }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4

      # flutter-action only ships x64 SDKs for Linux/Windows; use git on arm64.
      - if: matrix.arch != 'arm64'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - if: matrix.arch == 'arm64'
        shell: bash
        run: |
          git clone --depth 1 -b stable https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev patchelf

      - run: flutter pub get
      - shell: bash
        run: >
          flutter build ${{ matrix.os }} --release
          --build-number=${{ inputs.build-number }}
          --dart-define=APP_VERSION=${{ inputs.name }}
          ${{ inputs.build-name && format('--build-name={0}', inputs.build-name) || '' }}

      - name: Package (Linux)
        if: matrix.os == 'linux'
        run: tar -czf "$NAME.tar.gz" -C build/linux/${{ matrix.arch }}/release/bundle .
      - name: AppImage (Linux)
        if: matrix.os == 'linux'
        run: |
          case "${{ matrix.arch }}" in
            x64)   TOOL_ARCH=x86_64  ;;
            arm64) TOOL_ARCH=aarch64 ;;
          esac
          curl -fsSLo linuxdeploy \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${TOOL_ARCH}.AppImage"
          curl -fsSLo linuxdeploy-plugin-appimage \
            "https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-${TOOL_ARCH}.AppImage"
          chmod +x linuxdeploy linuxdeploy-plugin-appimage
          # CI runners have no FUSE; extract-and-run avoids mounting the AppImage.
          export APPIMAGE_EXTRACT_AND_RUN=1

          BUNDLE="build/linux/${{ matrix.arch }}/release/bundle"
          mkdir -p AppDir/usr/bin \
                   AppDir/usr/share/icons/hicolor/512x512/apps \
                   AppDir/usr/share/applications

          cp "$BUNDLE/eqloader"   AppDir/usr/bin/
          cp -r "$BUNDLE/lib"     AppDir/usr/bin/lib
          cp -r "$BUNDLE/data"    AppDir/usr/bin/data

          cp web/icons/Icon-512.png \
             AppDir/usr/share/icons/hicolor/512x512/apps/eqloader.png
          printf '[Desktop Entry]\nName=EQ Loader\nExec=eqloader\nIcon=eqloader\nType=Application\nCategories=AudioVideo;Audio;\n' \
            > AppDir/usr/share/applications/eqloader.desktop

          # Pass each bundled Flutter .so so linuxdeploy resolves their system deps.
          LIBS_ARGS=()
          while IFS= read -r lib; do
            LIBS_ARGS+=(--library "$lib")
          done < <(find AppDir/usr/bin/lib -name '*.so')

          ./linuxdeploy \
            --appdir AppDir \
            --executable AppDir/usr/bin/eqloader \
            "${LIBS_ARGS[@]}" \
            --output appimage

          mv *.AppImage "$NAME.AppImage"
      - name: Package (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: Compress-Archive -Path "build/windows/${{ matrix.arch }}/runner/Release/*" -DestinationPath "$env:NAME.zip"
      # The zip above stays as the portable version; this adds <name>-setup.exe.
      - name: Installer (Windows)
        if: matrix.os == 'windows' && inputs.installer
        shell: pwsh
        run: |
          # Pinned Inno Setup 6 (the .iss needs 6.3+ for x64compatible).
          $setup = "$env:RUNNER_TEMP\innosetup.exe"
          Invoke-WebRequest https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe -OutFile $setup
          Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -Wait
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc `
            "/DAppVersion=${{ inputs.build-name || '0.0.0' }}" `
            "/DAppTag=${{ inputs.name }}" `
            "/DArch=${{ matrix.arch }}" `
            "/DSourceDir=$PWD\build\windows\${{ matrix.arch }}\runner\Release" `
            "/DOutputDir=$PWD" `
            "/DOutputName=$env:NAME-setup" `
            windows\installer\eqloader.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package (macOS)
        if: matrix.os == 'macos'
        run: |
          app=$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' | head -1)
          ditto -c -k --keepParent "$app" "$NAME.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-${{ matrix.arch }}
          path: |
            eqloader-*.tar.gz
            eqloader-*.zip
            eqloader-*-setup.exe
            eqloader-*.AppImage
