name: Web preview

# Every push to flutter-rewrite publishes the web app to the dev preview at
# https://<owner>.github.io/<repo>/preview/. The main site is only updated
# by release.yml.
on:
  push:
    branches: [flutter-rewrite]

permissions:
  contents: write # push to the gh-pages branch

jobs:
  preview:
    runs-on: ubuntu-latest
    # Serialize with release.yml's deploy: both rewrite gh-pages.
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # CanvasKit from the site itself (not Google's CDN), so the installed
      # web app works offline.
      - run: >
          flutter build web --release --no-web-resources-cdn
          --base-href "/${{ github.event.repository.name }}/preview/"
          --dart-define=APP_VERSION=preview-${GITHUB_SHA::7}
      - name: Publish to gh-pages (preview/)
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/publish-pages.sh build/web preview
